# 门禁载体：把「本机能跑」变成「有人替你跑，且跑没跑有凭证」。
#
# 为什么需要这个文件：`nextentity.requireContainer` 默认 `false`，Docker 不可用时整条容器通道
# 计为 skip、构建照样绿（本地开发需要这个宽进）。AGENTS.md 要求「CI 必须加
# `-Dnextentity.requireContainer=true`」，而在本文件出现之前这条要求**没有执行载体**。
#
# 为什么改成调 `tools/gate.sh` 而不是直接写 `./mvnw`：裸命令在成功和「整条通道没跑」时
# 退出码都是 0。`-DskipITs` 不产生任何标记，而 `target/failsafe-reports/` 里上一轮的通过
# XML 会原地留存——人手看日志看不出来，脚本读产物则会读到上一轮的结论。gate.sh 的判据是
# 「报告 mtime 晚于本步开始时间」，并把结果落成 `receipt.json` 作为构建产物。
#
# 三条刻意的取舍：
# - **PIT 不进本流程**：各模块 95% 阈值跑得慢，放 nightly.yml。本流程只保证「该跑的通道都
#   真跑了」。
# - **不跑方言矩阵**：`-Dnextentity.h2mode=postgresql` 是 opt-in 的手工实验，它在 H2 的 PG
#   兼容模式下有 8 条**预期红**（3 条 SQL 文本快照 + 5 条 `for no key update` / `for share`
#   的锁语法，H2 的 PG 兼容模式不认）。没有「只允许这 8 条红」的基线机制之前，把它放进 CI
#   只会得到一个长期红的 workflow，等于把门禁关掉。基线机制落地后再开这一格。
# - **JDK 由 pom 的 `maven.compiler.release` 决定**，这里显式 setup 同一个大版本，避免
#   runner 默认 JDK 与本地不一致而让「本地绿、CI 红」变成噪音。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 镜像源：根 pom 的默认是 `docker.xuanyuan.run/...`（受限网络下的镜像站），GitHub runner
# 拉不到，容器通道会整条卡死（实测：PG 通道 33 个类全部 `ContainerFetchException`，2 分钟
# 拉取超时，见 run 40907903603）。这里用 gate.sh 的 GATE_EXTRA_MVN_ARGS 把 mysql / postgres
# / ryuk 换回 Docker Hub 原名——runner 能直连，代价是吃匿名拉取限流（每 IP 每 6 小时 100 次），
# 偶发 429 会让容器步随机红。要彻底摆脱这个外部依赖，得换成 `services:` 起 MySQL + 外部
# 实例模式（见 nextentity-tests-jpa 的 MySqlL4Container）。
# SQL Server 不用覆盖：它的默认值本来就是 `mcr.microsoft.com`，runner 能直连。
#
# 为什么不用 env：这三个值是 pom 的 `<properties>`（`nextentity.postgres.image` 在
# `nextentity-tests-jdbc/pom.xml` 的 `jdbc-postgres` profile 里传给 failsafe），只在 Maven
# 侧解析，环境变量覆盖不了；而 gate.sh 的命令行是写死的数组，只能从 GATE_EXTRA_MVN_ARGS 注入 -D。
env:
  GATE_EXTRA_MVN_ARGS: "-Dnextentity.mysql.image=library/mysql:8.0.18 -Dnextentity.postgres.image=library/postgres:16 -Dnextentity.ryuk.image=testcontainers/ryuk:0.11.0"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 判据不能由被判对象提供：`tools/gate-receipt.py` 若跟着 PR 一起改，
      # 改一行 `problems=[]` 就能把自己判绿，而 `--require-clean` 管不着（改动已提交）。
      # 关键：下到工作树**之外**的 $RUNNER_TEMP，再用 GATE_ROOT 指回工作树执行。
      # 早先版本用 `git show > tools/…` 覆盖工作树，那会把树弄脏，紧跟的 --require-clean
      # 必然 exit 1——等于让任何修改门禁脚本的 PR 永远红，机制从此无法演进。
      - name: Stage gate scripts from base branch
        run: |
          BASE="${{ github.base_ref }}"
          DEST="$RUNNER_TEMP/base-gate"
          mkdir -p "$DEST"
          if [ -z "$BASE" ]; then
            # 非 PR 触发（push 到 main）没有「基线」这个概念——门禁脚本就用工作树这份。
            # 早先版本这里 `cp` 了但立刻 `exit 0`，GATE_SCRIPT 从未写入，下一步永远回落到
            # 工作树那份：行为正确却是死代码，会让人误以为非 PR 路径也在用基线脚本。
            echo "非 PR 触发，无基线分支，使用工作树版本"
            echo "GATE_SCRIPT=$PWD/tools/gate.sh" >> "$GITHUB_ENV"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          # 先判完整性，再决定复制哪些——不能把「校验」和「复制」塞进同一个循环。
          # 早先版本 `for f in gate.sh gate-receipt.py` 在基线无 tools/ 时：第一轮
          # f=gate.sh 走「首次引入」分支把两个文件都 cp 了，第二轮 f=gate-receipt.py
          # 又 `git cat-file -e` 失败 → 走 `elif` → 打印「基线不自洽」并 exit 1。
          # 结果是首次引入机制的 PR 自己必红，机制永远落不了地（审查员实测 exit=1）。
          have_sh=0
          have_receipt=0
          git cat-file -e "origin/$BASE:tools/gate.sh" 2>/dev/null && have_sh=1
          git cat-file -e "origin/$BASE:tools/gate-receipt.py" 2>/dev/null && have_receipt=1
          if [ "$have_sh" = 0 ] && [ "$have_receipt" = 0 ]; then
            # 基线无 tools/ = 本 PR 首次引入该机制，只能用 PR 版本（并在日志里说清）。
            echo "origin/$BASE 无 tools/，本次使用 PR 版本（首次引入机制）"
            cp tools/gate.sh tools/gate-receipt.py "$DEST/"
          elif [ "$have_sh" = 1 ] && [ "$have_receipt" = 1 ]; then
            git show "origin/$BASE:tools/gate.sh" > "$DEST/gate.sh"
            git show "origin/$BASE:tools/gate-receipt.py" > "$DEST/gate-receipt.py"
            echo "已取基线版本 tools/gate.sh、tools/gate-receipt.py ← origin/$BASE"
          else
            # 半成品基线（有其一无其二）：判据无法确定，不能猜，fail-closed。
            echo "✗ origin/$BASE 的 tools/ 不自洽（gate.sh=$have_sh receipt=$have_receipt），拒绝继续" >&2
            exit 1
          fi
          chmod +x "$DEST/gate.sh"
          echo "GATE_SCRIPT=$DEST/gate.sh" >> "$GITHUB_ENV"

      # ci 档 = 架构规则 + H2 全量 + 容器通道（强制）+ 遗留 727 条回归。
      # `--require-clean`：CI 上凭证必须对得上一个 commit，脏树直接拒。
      # 镜像源覆盖见文件头的 `env.GATE_EXTRA_MVN_ARGS`。
      - name: Gate (ci tier + receipt)
        run: |
          GATE="${GATE_SCRIPT:-$PWD/tools/gate.sh}"
          echo "使用门禁脚本：$GATE"
          GATE_ROOT="$PWD" "$GATE" ci --require-clean

      # 凭证一直是构建产物，失败时也要拿到——否则「为什么红」只能靠翻几千行日志。
      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-receipt
          path: tmp/gate/**/receipt.json
          if-no-files-found: warn

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-logs
          path: tmp/gate/
          if-no-files-found: ignore
