# 门禁载体：把「本机能跑」变成「有人替你跑，且跑没跑有凭证」。
#
# 为什么需要这个文件：`nextentity.requireContainer` 默认 `false`，Docker 不可用时整条容器通道
# 计为 skip、构建照样绿（本地开发需要这个宽进）。AGENTS.md 要求「CI 必须加
# `-Dnextentity.requireContainer=true`」，而在本文件出现之前这条要求**没有执行载体**。
#
# 为什么改成调 `tools/gate.sh` 而不是直接写 `./mvnw`：裸命令在成功和「整条通道没跑」时
# 退出码都是 0。`-DskipITs` 不产生任何标记，而 `target/failsafe-reports/` 里上一轮的通过
# XML 会原地留存——人手看日志看不出来，脚本读产物则会读到上一轮的结论。gate.sh 的判据是
# 「报告 mtime 晚于本步开始时间」，并把结果落成 `receipt.json` 作为构建产物。
#
# 三条刻意的取舍：
# - **PIT 不进本流程**：各模块 95% 阈值跑得慢，放 nightly.yml。本流程只保证「该跑的通道都
#   真跑了」。
# - **不跑方言矩阵**：`-Dnextentity.h2mode=postgresql` 是 opt-in 的手工实验，它在 H2 的 PG
#   兼容模式下有 8 条**预期红**（3 条 SQL 文本快照 + 5 条 `for no key update` / `for share`
#   的锁语法，H2 的 PG 兼容模式不认）。没有「只允许这 8 条红」的基线机制之前，把它放进 CI
#   只会得到一个长期红的 workflow，等于把门禁关掉。基线机制落地后再开这一格。
# - **JDK 由 pom 的 `maven.compiler.release` 决定**，这里显式 setup 同一个大版本，避免
#   runner 默认 JDK 与本地不一致而让「本地绿、CI 红」变成噪音。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 判据不能由被判对象提供：`tools/gate-receipt.py` 若跟着 PR 一起改，
      # 改一行 `problems=[]` 就能把自己判绿，而 `--require-clean` 管不着（改动已提交）。
      # 关键：下到工作树**之外**的 $RUNNER_TEMP，再用 GATE_ROOT 指回工作树执行。
      # 早先版本用 `git show > tools/…` 覆盖工作树，那会把树弄脏，紧跟的 --require-clean
      # 必然 exit 1——等于让任何修改门禁脚本的 PR 永远红，机制从此无法演进。
      - name: Stage gate scripts from base branch
        run: |
          BASE="${{ github.base_ref }}"
          DEST="$RUNNER_TEMP/base-gate"
          mkdir -p "$DEST"
          if [ -z "$BASE" ]; then
            echo "非 PR 触发，无基线分支，使用工作树版本"
            cp tools/gate.sh tools/gate-receipt.py "$DEST/"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          for f in gate.sh gate-receipt.py; do
            if git cat-file -e "origin/$BASE:tools/$f" 2>/dev/null; then
              git show "origin/$BASE:tools/$f" > "$DEST/$f"
              echo "已取基线版本 tools/$f ← origin/$BASE"
            elif [ "$f" = "gate-receipt.py" ]; then
              # 基线有 gate.sh 却没有 receipt：说明基线处于半成品状态，不能猜。
              echo "✗ origin/$BASE 有 tools/gate.sh 但缺 tools/gate-receipt.py，基线不自洽" >&2
              exit 1
            else
              # 基线无 gate.sh = 本 PR 首次引入该机制，只能用 PR 版本（并在日志里说清）。
              echo "origin/$BASE 无 tools/gate.sh，本次使用 PR 版本（首次引入机制）"
              cp tools/gate.sh tools/gate-receipt.py "$DEST/"
            fi
          done
          chmod +x "$DEST/gate.sh"
          echo "GATE_SCRIPT=$DEST/gate.sh" >> "$GITHUB_ENV"

      # ci 档 = 架构规则 + H2 全量 + 容器通道（强制）+ 遗留 727 条回归。
      # `--require-clean`：CI 上凭证必须对得上一个 commit，脏树直接拒。
      - name: Gate (ci tier + receipt)
        run: |
          GATE="${GATE_SCRIPT:-$PWD/tools/gate.sh}"
          echo "使用门禁脚本：$GATE"
          GATE_ROOT="$PWD" "$GATE" ci --require-clean

      # 凭证一直是构建产物，失败时也要拿到——否则「为什么红」只能靠翻几千行日志。
      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt
          path: tmp/gate/**/receipt.json
          if-no-files-found: warn

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: tmp/gate/
          if-no-files-found: ignore
